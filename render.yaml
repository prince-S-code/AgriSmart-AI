
services:
  # Backend API
  - type: web
    name: agrismart-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/agrismart.db
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: CORS_ORIGINS
        value: https://agrismart-web-bkln.onrender.com
      - key: ENABLE_YOLO
        value: "false"

  # Frontend
  - type: web
    name: agrismart-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist

    envVars:
      - key: VITE_API_URL
        value: https://agrismart-api-tphl.onrender.com
